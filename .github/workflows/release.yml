name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update module.json Version and Download Link
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          jq ".version = \"$VERSION\" | .download = \"https://github.com/${{ github.repository }}/releases/download/$TAG/module.zip\"" module.json > temp.json && mv temp.json module.json

      - name: Create Zip
        run: zip -r ./module.zip module.json scripts/ styles/ lang/

      - name: Update Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.draft }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json,./module.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}